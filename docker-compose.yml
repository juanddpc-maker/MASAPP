version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: escuela_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: escuela_admin
      POSTGRES_PASSWORD: escuela_dev_2026
      POSTGRES_DB: escuela_artes_marciales
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escuela_admin -d escuela_artes_marciales"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Interfaz visual para explorar la base de datos (opcional, muy util al inicio)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: escuela_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@escuela.local
      PGADMIN_DEFAULT_PASSWORD: escuela_dev_2026
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db_data:
